generic-service:
  nameOverride: hmpps-warrant-risk-assessment-api
  productId: "HMPPS501" # productId for the product that this belongs too, i.e. DPS001, see README.md for details

  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-warrant-risk-assessment-api
    tag: app_version # override at deployment time
    port: 8080

  ingress:
    enabled: true
    host: app-hostname.local # override per environment
    tlsSecretName: hmpps-warrant-risk-assessment-api-cert

  # Environment variables to load into the deployment
  env:
    SERVER_PORT: "8080"
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: applicationinsights.json
    GOTENBERG_URL: http://hmpps-warrant-risk-assessment-api-gotenberg

  namespace_secrets:
    hmpps-warrant-risk-assessment-api-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: "APPLICATIONINSIGHTS_CONNECTION_STRING"
    rds-instance-output:
      DATABASE_ENDPOINT: rds_instance_endpoint
      DATABASE_USERNAME: database_username
      DATABASE_PASSWORD: database_password
      DATABASE_NAME: database_name
    hmpps-domain-events:
      HMPPS_SQS_TOPICS_HMPPSWARRANTRISKASSESSMENTPUBLISHTOPIC_ARN: topic_arn
    sqs-queue:
      HMPPS_SQS_QUEUES_HMPPSWARRANTRISKASSESSMENTQUEUE_QUEUE_NAME: sqs_queue_name
    sqs-dlq:
      HMPPS_SQS_QUEUES_HMPPSWARRANTRISKASSESSMENTQUEUE_DLQ_NAME: sqs_queue_name

  allowlist:
    groups:
      - internal

gotenberg:
  nameOverride: gotenberg
  replicaCount: 2

  image:
    repository: gotenberg/gotenberg
    tag: 8
    port: 3000

  ingress:
    enabled: false

  livenessProbe:
    httpGet:
      path: /health
    periodSeconds: 30
    initialDelaySeconds: 60
    timeoutSeconds: 20
    failureThreshold: 10

  readinessProbe:
    httpGet:
      path: /health
    periodSeconds: 20
    initialDelaySeconds: 60
    timeoutSeconds: 30
    failureThreshold: 15

  podSecurityContext:
    fsGroup: 1001

  securityContext:
    runAsUser: 1001
    runAsNonRoot: true
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    privileged: false

  env:
    GOOGLE_CHROME_IGNORE_CERTIFICATE_ERRORS: 1
    DISABLE_UNOCONV: 1
    DEFAULT_WAIT_TIMEOUT: 30

generic-prometheus-alerts:
  targetApplication: hmpps-warrant-risk-assessment-api
